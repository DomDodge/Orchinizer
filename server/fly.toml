# Deploy from the repo root with ./server/deploy.sh
# Game state is in memory, so run exactly ONE machine and never auto-stop it.
app = "orchinizer"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
